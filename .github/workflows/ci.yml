name: CI Pipeline

on:
    push:
        branches: ['develop', 'staging', 'production', 'master']
    pull_request:

permissions:
    contents: read

# A new push to the same PR cancels the run it supersedes. Branch pushes
# never cancel: each run diffs only its own push, so a cancelled run could
# let a dependency change land without a blocking audit.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        name: Detect changed paths
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            # paths-filter lists a PR's files through the API.
            pull-requests: read
        outputs:
            deps: ${{ steps.filter.outputs.deps }}
            docker: ${{ steps.filter.outputs.docker }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v5
              with:
                  # On pushes paths-filter diffs in git against the push's
                  # `before` commit, so it needs the history.
                  fetch-depth: 0

            - name: Filter paths
              id: filter
              uses: dorny/paths-filter@v3
              with:
                  # Push: naming the pushed branch itself makes paths-filter
                  # diff against the push's `before` commit (not against the
                  # default branch). Ignored on pull_request, which uses the
                  # PR's own file list.
                  base: ${{ github.ref_name }}
                  filters: |
                      deps:
                        - 'pnpm-lock.yaml'
                        - '**/package.json'
                      # What the Dockerfiles copy or run, except app and
                      # contracts source, which the verify job builds.
                      docker:
                        - 'apps/api/Dockerfile'
                        - 'apps/client/Dockerfile'
                        - '.dockerignore'
                        - 'apps/client/nginx.conf.template'
                        - 'apps/client/docker-entrypoint.sh'
                        - 'apps/api/railway.json'
                        - 'apps/client/railway.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'
                        - 'package.json'
                        - '**/package.json'

    verify:
        name: Verify
        needs: changes
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v5
              # version comes from the root package.json "packageManager" field

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22.x'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            # Its dist is gitignored, and lint, typecheck and test in the apps
            # resolve @grocery-pos/contracts through it.
            - name: Build Contracts
              run: pnpm --filter @grocery-pos/contracts build

            - name: Format Check
              run: pnpm format:check

            # Gates only changes to pnpm-lock.yaml or a package.json; on any
            # other change a new public advisory shows here without failing
            # the run (the weekly audit.yml workflow catches those).
            - name: Security Audit
              run: pnpm audit --audit-level high
              continue-on-error: ${{ needs.changes.outputs.deps != 'true' }}

            - name: Dependency Hygiene (Depcheck)
              run: pnpm -r exec depcheck

            - name: License Compliance Check
              run: pnpm licenses:check

            - name: Lint
              run: pnpm -r lint

            - name: Typecheck
              run: pnpm -r typecheck

            # Every package's test script runs with coverage thresholds.
            - name: Test
              run: pnpm -r test

            - name: Build
              run: pnpm -r build
              env:
                  VITE_APP_ENV: prod
                  VITE_API_URL: https://api.ci-test.com
                  VITE_DOMAIN: ci-test.com
                  VITE_API_TIMEOUT: 5000

    # The real-database suite (issue #30): unique partial indexes,
    # transactions under concurrency and rollback, which mocked models
    # cannot prove. Service containers cannot take a command, and
    # transactions need a replica set, so MongoDB is started with the same
    # mongo-init.sh docker-compose.yml uses (mongod --replSet rs0, then
    # rs.initiate).
    db:
        name: DB tests (MongoDB replica set)
        runs-on: ubuntu-latest
        # Jest has no forceExit here: a hung handle must not burn 6 hours.
        timeout-minutes: 15
        env:
            MONGO_URI_TEST: mongodb://127.0.0.1:27017/?directConnection=true
        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Start MongoDB replica set
              run: >-
                  docker run --detach --name mongodb
                  --publish 127.0.0.1:27017:27017
                  --volume "$GITHUB_WORKSPACE/mongo-init.sh:/mongo-init.sh:ro"
                  --entrypoint /bin/bash
                  mongo:7.0 /mongo-init.sh

            - name: Setup pnpm
              uses: pnpm/action-setup@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '22.x'
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Contracts
              run: pnpm --filter @grocery-pos/contracts build

            - name: Wait for the replica set primary
              run: |
                  for i in $(seq 1 60); do
                      if docker exec mongodb mongosh --quiet --eval 'rs.status().myState' 2>/dev/null | grep -qx 1; then
                          echo "Replica set is primary."
                          exit 0
                      fi
                      sleep 1
                  done
                  docker logs mongodb
                  exit 1

            - name: DB tests
              run: pnpm --filter grocery-pos-api test:db

            - name: MongoDB logs on failure
              if: failure()
              run: docker logs mongodb 2>&1 | tail -200

    docker:
        name: Docker images (build only)
        needs: changes
        if: needs.changes.outputs.docker == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            DOCKER_BUILDKIT: 1
        steps:
            - name: Checkout Code
              uses: actions/checkout@v5

            - name: Build API image
              run: docker build --file apps/api/Dockerfile --tag grocery-pos-api:ci .

            - name: Build client image
              run: >-
                  docker build --file apps/client/Dockerfile
                  --build-arg VITE_APP_ENV=prod
                  --build-arg VITE_API_URL=https://api.ci-test.com
                  --build-arg VITE_DOMAIN=ci-test.com
                  --build-arg VITE_API_TIMEOUT=5000
                  --tag grocery-pos-client:ci .

            # The client image as deployed: unprivileged nginx, the security
            # headers and a /health that needs index.html (#29).
            - name: Smoke-test client image
              run: |
                  # Print the container's logs on failure and always remove it.
                  cleanup() {
                      status=$?
                      if [ "$status" -ne 0 ]; then docker logs client || true; fi
                      docker rm -f client >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT
                  docker run -d --name client -p 127.0.0.1:8080:8080 grocery-pos-client:ci
                  for _ in $(seq 1 30); do
                      curl -fsS -o /dev/null http://127.0.0.1:8080/health && break
                      sleep 1
                  done
                  curl -fsS http://127.0.0.1:8080/health
                  test "$(docker exec client id -u)" != 0
                  headers=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/)
                  echo "$headers"
                  echo "$headers" | grep -qi "^content-security-policy: .*connect-src 'self' https://api.ci-test.com;"
                  echo "$headers" | grep -qi '^x-content-type-options: nosniff'
                  echo "$headers" | grep -qi '^strict-transport-security: max-age=31536000'
                  echo "$headers" | grep -qi '^cache-control: no-cache'
                  # CSP reports go to the API (#94).
                  echo "$headers" | grep -qi "^content-security-policy: .*; report-to csp-endpoint; report-uri https://api.ci-test.com/v1/csp-report"
                  echo "$headers" | grep -qi '^reporting-endpoints: csp-endpoint="https://api.ci-test.com/v1/csp-report"'
                  echo "$headers" | grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()'
